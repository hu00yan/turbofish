version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: turbofish-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  turbofish:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turbofish-service
    depends_on:
      minio:
        condition: service_healthy
    environment:
      SPND_STORE: "s3"
      SPND_PORT: "8080"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "turbofish-test"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
    ports:
      - "8080:8080"

volumes:
  minio_data:
